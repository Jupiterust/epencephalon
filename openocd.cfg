# OpenOCD 配置 —— RoboMaster 开发板 A (STM32F427IIH6) + DAP-Link / CMSIS-DAP
#
# tasks.json 的「烧录」任务和 launch.json 的调试会话都用这一个文件，
# 所以调参数（速度、序列号）只改这里一处。

source [find interface/cmsis-dap.cfg]

# 开发板 A 的 SWD 排针只有 SWDIO/SWCLK/GND/3V3，必须走 SWD 而不是 JTAG
transport select swd

source [find target/stm32f4x.cfg]

# stm32f4x.cfg 默认 2000 kHz。DAP-Link 正品可以跑 4000；
# 若出现 "Could not initialize the debug port" 或烧录中途断开，
# 多半是杜邦线太长或克隆固件跟不上，把这里降到 1000 即可。
adapter speed 4000

# 复位方式：开发板 A 的 SWD 排针没有引出 NRST，
# 所以这里不覆盖 reset_config，沿用 stm32f4x.cfg 里的 sysresetreq（软复位）。
